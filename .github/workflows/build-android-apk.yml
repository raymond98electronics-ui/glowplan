# GlowPlan: self-contained GitHub Actions Android APK build.
# Upload ONLY this file as .github/workflows/build-android-apk.yml.
# Self-contained: reconstructs the GlowPlan app with corrected Kotlin compiler configuration.
name: Build GlowPlan Android APK

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

